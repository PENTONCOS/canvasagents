# CanvasAgents Sync Server — Cloudflare Workers configuration.
#
# 1. Create the D1 database and copy its `database_id` into the binding below:
#      npx wrangler d1 create canvasagents-sync
#    (or list existing ones with `npx wrangler d1 list`)
# 2. Create the R2 bucket for file blobs:
#      npx wrangler r2 bucket create canvasagents-sync-files
# 3. Apply the schema, then deploy:
#      npx wrangler d1 execute canvasagents-sync --file=schema.sql --remote
#      npx wrangler deploy

name = "canvasagents-sync"
main = "src/index.js"
compatibility_date = "2026-10-13"

# D1: accounts, tokens, manifests. Replace database_id with the id printed by
# `npx wrangler d1 create canvasagents-sync`.
[[d1_databases]]
binding = "DB"
database_name = "canvasagents-sync"
database_id = "00000000-0000-0000-0000-000000000000"

# R2: file blobs (the R2 bucket name can differ from the binding name).
[[r2_buckets]]
binding = "FILES"
bucket_name = "canvasagents-sync-files"
