name: Deploy to Surge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-surge
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Publish to Surge
        working-directory: web
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          set +e
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::notice::SURGE_TOKEN secret is not set - skipping Surge publish."
            exit 0
          fi
          # Strip any stray whitespace/newlines introduced when pasting the secret.
          TOKEN="$(printf '%s' "$SURGE_TOKEN" | tr -d '[:space:]')"
          echo "token_length=${#TOKEN}"
          echo "canvas-agents.surge.sh" > dist/CNAME
          printf 'machine surge.surge.sh\n  login canvas9f2kafec3f@maxxspace.com\n  password %s\n' "$TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          OUT="$(npx --yes surge dist canvas-agents.surge.sh --token "$TOKEN" 2>&1)"
          RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            MSG="$(printf '%s' "$OUT" | tail -c 900 | tr '\n' '|')"
            echo "::error::surge publish failed rc=$RC token_length=${#TOKEN} :: $MSG"
            exit 1
          fi
