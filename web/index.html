<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Agent 创作工作台：在无限画布上指挥 AI 干活" />
        <link rel="icon" href="/logo.svg" />
        <title>CanvasAgents</title>
        <script>
            try {
                var legacyThemeKey = atob("aW5maW5pdGUtY2FudmFz") + ":theme_store";
                var s = JSON.parse(localStorage.getItem("canvasagents:theme_store") || localStorage.getItem(legacyThemeKey) || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <!-- 启动壳：JS 包体解析完成前先给出可见反馈，避免「一直黑屏像打不开」 -->
        <div id="root">
            <div id="boot-shell" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0b0b0d;color:#e8e8ea;font:14px/1.6 -apple-system,'SF Pro Text','PingFang SC',sans-serif">
                <div style="font-size:15px;letter-spacing:.08em;opacity:.9">▲ CanvasAgents</div>
                <div style="position:relative;width:180px;height:3px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden">
                    <div style="position:absolute;inset:0;width:40%;border-radius:999px;background:#fff;animation:boot-slide 1.1s ease-in-out infinite"></div>
                </div>
                <div id="boot-hint" style="font-size:12px;opacity:.55">正在加载画布…</div>
            </div>
            <style>
                @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
                @media (prefers-reduced-motion: reduce) { #boot-shell div[style*="boot-slide"] { animation: none; } }
            </style>
        </div>
        <script src="/config.js"></script>
        <script type="module" src="/src/main.tsx"></script>
        <script>
            // 首次加载慢时给出可理解的说明，而不是让人盯着黑屏猜。
            window.setTimeout(function () {
                var hint = document.getElementById("boot-hint");
                if (!hint || !document.getElementById("boot-shell")) return;
                hint.textContent = "首次打开需要下载资源，网络慢时会久一点…";
            }, 6000);
            window.setTimeout(function () {
                var hint = document.getElementById("boot-hint");
                if (!hint || !document.getElementById("boot-shell")) return;
                hint.innerHTML = '加载时间偏长，<a href="" style="color:#9ecbff">点此重试</a>';
            }, 25000);
        </script>
    </body>
</html>
